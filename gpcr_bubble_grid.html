<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPCR Mutation Bubble Grid</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #ffffff;
    --surface: #f4f6ff;
    --surface2: #eaedff;
    --border: #d0d6f0;
    --border2: #b0bae8;
    --text: #0d1240;
    --muted: #6670a0;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); padding: 2.5rem 2rem 5rem; min-height: 100vh; }

  .page-header { margin-bottom: 2rem; }
  .page-header h1 {
    font-size: 1.5rem; font-weight: 800; color: #0d1240;
    letter-spacing: -0.03em;
  }
  .page-header p { font-size: 0.82rem; color: var(--muted); margin-top: 0.35rem; font-weight: 500; }

  .scroll-wrap { overflow-x: auto; }

  .grid-container {
    display: grid;
    grid-template-columns: 72px repeat(8, 1fr);
    border: 2px solid var(--border2);
    border-radius: 12px;
    overflow: hidden;
    min-width: 960px;
    box-shadow: 0 4px 32px rgba(80,100,200,0.10);
    background: #fff;
  }

  .h-spacer {
    grid-column: 1; grid-row: 1 / 3;
    background: var(--surface2);
    border-right: 2px solid var(--border2);
    border-bottom: 2px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em;
    text-transform: uppercase; font-weight: 700; text-align: center; padding: 6px;
  }

  .h-parent {
    background: var(--surface);
    border-right: 2px solid var(--border2);
    border-bottom: 1px solid var(--border);
    text-align: center;
    font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em;
    padding: 9px 4px 6px;
    display: flex; align-items: center; justify-content: center;
  }

  .h-sub {
    background: #fff;
    border-right: 1px solid var(--border);
    border-bottom: 2px solid var(--border2);
    text-align: center;
    font-size: 0.65rem; font-weight: 700; color: var(--muted);
    padding: 5px 3px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1.25; letter-spacing: 0.02em;
  }

  .tm-label {
    background: var(--surface2);
    border-right: 2px solid var(--border2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.9rem; font-weight: 700; color: #0d1240;
    padding: 0 8px; min-height: 96px;
  }

  .cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    min-height: 96px; position: relative;
    transition: background 0.12s;
    padding: 8px; flex-wrap: wrap; gap: 5px; align-content: center;
    background: #fff;
  }
  .cell:hover { background: var(--surface); }
  .cell.class-start { border-left: 2px solid var(--border2); }

  .bubble {
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; color: #fff;
    cursor: pointer;
    transition: transform 0.13s, box-shadow 0.13s;
    flex-shrink: 0;
    border: 2.5px solid rgba(255,255,255,0.55);
    line-height: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  .bubble:hover {
    transform: scale(1.22);
    box-shadow: 0 0 0 4px rgba(0,0,0,0.12), 0 6px 20px rgba(0,0,0,0.18);
    z-index: 50;
  }

  .tt {
    position: fixed; background: #0d1240; border: 2px solid #3a4aaa;
    border-radius: 10px; padding: 0.65rem 1rem; font-size: 0.75rem;
    color: #fff; pointer-events: none; opacity: 0; transition: opacity 0.1s;
    z-index: 999; max-width: 290px; line-height: 1.8;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }
  .tt-receptor { font-weight: 800; font-size: 0.92rem; }
  .tt-bw { font-family: var(--mono); color: #7eb8ff; font-size: 0.78rem; }
  .tt-note { color: #b0c0e8; font-size: 0.71rem; }
  .tt-count { color: #ffe066; font-size: 0.72rem; margin-top: 3px; font-weight: 700; }

  /* legends */
  .legends {
    display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 1rem; margin-top: 1.25rem; align-items: stretch;
    width: 100%;
  }
  .legend-box {
    background: var(--surface);
    border: 1.5px solid var(--border2);
    border-radius: 10px; padding: 0.6rem 1rem;
    box-shadow: 0 2px 10px rgba(80,100,200,0.07);
    display: flex; flex-direction: column; justify-content: center;
  }
  .legend-box.rec-box { flex: 1 1 480px; min-width: 0; }
  .legend-box.size-box { flex: 0 0 auto; }
  .legend-title { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.4rem; font-weight: 700; }
  .legend-items { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; align-items: center; }
  .l-item { display: flex; align-items: center; gap: 5px; font-size: 0.67rem; font-family: var(--mono); font-weight: 600; color: #0d1240; white-space: nowrap; }
  .l-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.15); flex-shrink: 0; }

  .size-legend { display: flex; align-items: center; gap: 0.7rem; }
  .size-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; color: var(--muted); font-family: var(--mono); font-weight: 700; }
  .size-circle {
    border-radius: 50%; background: #c0c8f0; border: 2px solid #a0aadc;
    display: flex; align-items: center; justify-content: center;
    color: #0d1240; font-family: var(--mono); font-weight: 700;
    text-shadow: none;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>GPCR Variant Functional Map</h1>
  <p>Y-axis: TM region &nbsp;·&nbsp; X-axis: Functional class → subclass &nbsp;·&nbsp; Colour: receptor &nbsp;·&nbsp; Size: number of mutations</p>
</div>

<div class="tt" id="tt"></div>

<div class="scroll-wrap">
  <div class="grid-container" id="grid"></div>
</div>

<div class="legends">
  <div class="legend-box rec-box">
    <div class="legend-title">Receptor</div>
    <div class="legend-items" id="rec-legend"></div>
  </div>
  <div class="legend-box size-box">
    <div class="legend-title">Dot size = mutations per cell</div>
    <div class="size-legend">
      <div class="size-item"><div class="size-circle" style="width:14px;height:14px;font-size:8px">1</div>1</div>
      <div class="size-item"><div class="size-circle" style="width:20px;height:20px;font-size:9px">2</div>2</div>
      <div class="size-item"><div class="size-circle" style="width:26px;height:26px;font-size:10px">3</div>3</div>
      <div class="size-item"><div class="size-circle" style="width:32px;height:32px;font-size:11px">4</div>4</div>
      <div class="size-item"><div class="size-circle" style="width:38px;height:38px;font-size:11px">5</div>5+</div>
    </div>
  </div>
</div>

<script>
const raw = [
  {receptor:"ADRA1A", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"ADRA1A", tm:"TM7", bw:"7.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P7.50 — NPxxY motif; structural pivot TM7"},
  {receptor:"ADRA1A", tm:"TM7", bw:"7.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P7.50 — NPxxY motif; structural pivot TM7"},
  {receptor:"ADRA1A", tm:"TM7", bw:"7.53", parent:"Motif", sub:"NPxxY", note:"Y7.53 — NPxxY motif; reorients toward TM3 on activation"},
  {receptor:"ADRB2", tm:"TM2", bw:"2.5", parent:"Binding Pocket", sub:"Na⁺ / Allosteric", note:"D2.50 — Na+ binding pocket; allosteric modulation"},
  {receptor:"ADRB2", tm:"TM3", bw:"3.5", parent:"G-protein Contact", sub:"Gα Direct", note:"R3.50 — DRY motif (PDB 3SN6 β2AR-Gs)"},
  {receptor:"ADRB2", tm:"TM6", bw:"6.47", parent:"Motif", sub:"CWxP", note:"C6.47 — CWxP motif"},
  {receptor:"ADRB3", tm:"TM4", bw:"4.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"W4.50 — structural pivot TM4"},
  {receptor:"ADRB3", tm:"TM5", bw:"5.41", parent:"Binding Pocket", sub:"Orthosteric", note:"TM5 — ligand binding pocket"},
  {receptor:"ADRB3", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"ADRB3", tm:"TM7", bw:"7.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P7.50 — NPxxY motif; structural pivot TM7"},
  {receptor:"AGTR1", tm:"TM2", bw:"2.5", parent:"Binding Pocket", sub:"Na⁺ / Allosteric", note:"D2.50 — Na+ binding pocket; allosteric modulation"},
  {receptor:"CASR", tm:"TM3", bw:"3.5", parent:"G-protein Contact", sub:"Gα Direct", note:"R3.50 — DRY motif; direct Gα contact upon activation"},
  {receptor:"CASR", tm:"TM5", bw:"5.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P5.50 — structural pivot TM5; flexibility for outward movement"},
  {receptor:"CASR", tm:"TM7", bw:"7.53", parent:"Motif", sub:"NPxxY", note:"Y7.53 — NPxxY motif; reorients toward TM3 on activation"},
  {receptor:"CNR1", tm:"TM5", bw:"5.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P5.50 — structural pivot TM5; flexibility for outward movement"},
  {receptor:"FFAR1", tm:"TM3", bw:"3.44", parent:"Binding Pocket", sub:"Orthosteric", note:"Upper TM3 — orthosteric ligand binding pocket"},
  {receptor:"FFAR1", tm:"TM7", bw:"7.49", parent:"Motif", sub:"NPxxY", note:"N7.49 — NPxxY motif"},
  {receptor:"FFAR1", tm:"TM7", bw:"7.53", parent:"Motif", sub:"NPxxY", note:"T7.53 (not Y) — atypical NPxxT in FFAR1"},
  {receptor:"FFAR2", tm:"TM2", bw:"2.5", parent:"Binding Pocket", sub:"Na⁺ / Allosteric", note:"D2.50 — Na+ binding pocket; allosteric modulation"},
  {receptor:"FFAR2", tm:"TM5", bw:"5.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P5.50 — structural pivot TM5; flexibility for outward movement"},
  {receptor:"FFAR2", tm:"TM6", bw:"6.33", parent:"G-protein Contact", sub:"Gα Direct", note:"TM6 cytoplasmic — direct G-protein α5 helix contact"},
  {receptor:"FFAR2", tm:"TM6", bw:"6.47", parent:"Motif", sub:"CWxP", note:"C6.47 — CWxP motif"},
  {receptor:"GHSR", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"GHSR", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"GLP2R", tm:"TM2", bw:"2.46", parent:"G-protein Contact", sub:"Gαs / Class B", note:"R2.46 — conserved class B Gαs contact"},
  {receptor:"GPBAR", tm:"TM4", bw:"4.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"W4.50 — structural pivot TM4"},
  {receptor:"GPBAR", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"GPBAR", tm:"TM7", bw:"7.49", parent:"Motif", sub:"NPxxY", note:"N7.49 — NPxxY motif"},
  {receptor:"GPR142", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"GPR142", tm:"TM6", bw:"6.5", parent:"Motif", sub:"CWxP", note:"P6.50 — CWxP motif; TM6 kink"},
  {receptor:"GPR75", tm:"TM1", bw:"1.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"N1.50 — structural pivot TM1; Na+/water channel"},
  {receptor:"GPR75", tm:"TM2", bw:"2.5", parent:"Binding Pocket", sub:"Na⁺ / Allosteric", note:"D2.50 — Na+ binding pocket; allosteric modulation"},
  {receptor:"GPR75", tm:"TM7", bw:"7.53", parent:"Motif", sub:"NPxxY", note:"Y7.53 — NPxxY motif; reorients toward TM3 on activation"},
  {receptor:"LPAR1", tm:"TM3", bw:"3.44", parent:"Binding Pocket", sub:"Orthosteric", note:"Upper TM3 — orthosteric ligand binding pocket"},
  {receptor:"LPAR1", tm:"TM3", bw:"3.49", parent:"Motif", sub:"DRY / Ionic Lock", note:"D/E3.49 — DRY/ERY motif; ionic lock partner"},
  {receptor:"LPAR1", tm:"TM3", bw:"3.49", parent:"Motif", sub:"DRY / Ionic Lock", note:"D/E3.49 — DRY/ERY motif; ionic lock partner"},
  {receptor:"LPAR1", tm:"TM3", bw:"3.51", parent:"Motif", sub:"DRY / Ionic Lock", note:"Y/H3.51 — DRY motif; ionic lock"},
  {receptor:"LPAR1", tm:"TM7", bw:"7.49", parent:"Motif", sub:"NPxxY", note:"N7.49 — NPxxY motif"},
  {receptor:"LPAR1", tm:"TM7", bw:"7.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P7.50 — NPxxY motif; structural pivot TM7"},
  {receptor:"LPAR3", tm:"TM3", bw:"3.5", parent:"G-protein Contact", sub:"Gα Direct", note:"R3.50 — DRY motif; direct Gα contact upon activation"},
  {receptor:"LPAR3", tm:"TM6", bw:"6.33", parent:"G-protein Contact", sub:"Gα Direct", note:"TM6 cytoplasmic — direct G-protein α5 helix contact"},
  {receptor:"LPAR3", tm:"TM7", bw:"7.49", parent:"Motif", sub:"NPxxY", note:"N7.49 — NPxxY motif"},
  {receptor:"LPAR5", tm:"TM3", bw:"3.44", parent:"Binding Pocket", sub:"Orthosteric", note:"Upper TM3 — orthosteric ligand binding pocket"},
  {receptor:"LPAR5", tm:"TM3", bw:"3.51", parent:"Motif", sub:"DRY / Ionic Lock", note:"Y/H3.51 — DRY motif; ionic lock"},
  {receptor:"LPAR5", tm:"TM6", bw:"6.33", parent:"G-protein Contact", sub:"Gα Direct", note:"TM6 cytoplasmic — direct G-protein α5 helix contact"},
  {receptor:"LPAR5", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"LPAR5", tm:"TM6", bw:"6.5", parent:"Motif", sub:"CWxP", note:"P6.50 — CWxP motif; TM6 kink"},
  {receptor:"LPAR6", tm:"TM1", bw:"1.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"N1.50 — structural pivot TM1; Na+/water channel"},
  {receptor:"LPAR6", tm:"TM3", bw:"3.44", parent:"Binding Pocket", sub:"Orthosteric", note:"Upper TM3 — orthosteric ligand binding pocket"},
  {receptor:"LPAR6", tm:"TM3", bw:"3.44", parent:"Binding Pocket", sub:"Orthosteric", note:"Upper TM3 — orthosteric ligand binding pocket"},
  {receptor:"LPAR6", tm:"TM4", bw:"4.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"W4.50 — structural pivot TM4"},
  {receptor:"LPAR6", tm:"TM6", bw:"6.33", parent:"G-protein Contact", sub:"Gα Direct", note:"TM6 cytoplasmic — direct G-protein α5 helix contact"},
  {receptor:"MC4R", tm:"TM7", bw:"7.53", parent:"Motif", sub:"NPxxY", note:"Y7.53 = Y265 — NPxxY"},
  {receptor:"MC4R", tm:"TM7", bw:"7.53", parent:"Motif", sub:"NPxxY", note:"Y7.53 = Y265 — NPxxY"},
  {receptor:"MTNR1B", tm:"TM4", bw:"4.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"W4.50 — structural pivot TM4"},
  {receptor:"MTNR1B", tm:"TM5", bw:"5.46", parent:"Structural Pivot", sub:"Structural Pivot", note:"TM5 — activation microswitch (4.53–5.46 contact pair)"},
  {receptor:"MTNR1B", tm:"TM5", bw:"5.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P5.50 — structural pivot TM5; flexibility for outward movement"},
  {receptor:"NPY1R", tm:"TM1", bw:"1.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"N1.50 — structural pivot TM1; Na+/water channel"},
  {receptor:"NPY1R", tm:"TM3", bw:"3.44", parent:"Binding Pocket", sub:"Orthosteric", note:"Upper TM3 — orthosteric ligand binding pocket"},
  {receptor:"NPY1R", tm:"TM3", bw:"3.49", parent:"Motif", sub:"DRY / Ionic Lock", note:"D/E3.49 — DRY/ERY motif; ionic lock partner"},
  {receptor:"NPY1R", tm:"TM5", bw:"5.46", parent:"Structural Pivot", sub:"Structural Pivot", note:"TM5 — activation microswitch (4.53–5.46 contact pair)"},
  {receptor:"NPY1R", tm:"TM7", bw:"7.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"P7.50 — NPxxY motif; structural pivot TM7"},
  {receptor:"PTGER3", tm:"TM6", bw:"6.33", parent:"G-protein Contact", sub:"Gα Direct", note:"TM6 cytoplasmic — direct G-protein α5 helix contact"},
  {receptor:"PTGER3", tm:"TM6", bw:"6.47", parent:"Motif", sub:"CWxP", note:"C6.47 — CWxP motif"},
  {receptor:"S1PR1", tm:"TM6", bw:"6.47", parent:"Motif", sub:"CWxP", note:"C6.47 — CWxP motif"},
  {receptor:"S1PR2", tm:"TM3", bw:"3.5", parent:"G-protein Contact", sub:"Gα Direct", note:"R3.50 — DRY motif; direct Gα contact upon activation"},
  {receptor:"S1PR2", tm:"TM6", bw:"6.47", parent:"Motif", sub:"CWxP", note:"C6.47 — CWxP motif"},
  {receptor:"S1PR2", tm:"TM6", bw:"6.48", parent:"Motif", sub:"CWxP", note:"W6.48 — CWxP toggle switch; rotates upon activation"},
  {receptor:"SCTR", tm:"TM3", bw:"3.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"Structural pivot TM3"},
  {receptor:"SSTR2", tm:"TM1", bw:"1.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"N1.50 — structural pivot TM1; Na+/water channel"},

  {receptor:"VIPR1", tm:"TM3", bw:"3.5", parent:"Structural Pivot", sub:"Structural Pivot", note:"Structural pivot TM3"},
  {receptor:"VIPR1", tm:"TM3", bw:"3.54", parent:"G-protein Contact", sub:"Gαs / Class B", note:"L3.54 — conserved class B Gαs contact"},
];

const SCHEMA = [
  { parent:"Binding Pocket",    color:"#FF5E00", textColor:"#FF5E00", bgColor:"#FFF2EB", subs:["Orthosteric","Na⁺ / Allosteric"] },
  { parent:"Motif",             color:"#8B00FF", textColor:"#8B00FF", bgColor:"#F5EEFF", subs:["NPxxY","DRY / Ionic Lock","CWxP"] },
  { parent:"Structural Pivot",  color:"#00A86B", textColor:"#007A4E", bgColor:"#EAFAF3", subs:["Structural Pivot"] },
  { parent:"G-protein Contact", color:"#0055FF", textColor:"#0044CC", bgColor:"#EBF1FF", subs:["Gα Direct","Gαs / Class B"] },
];

const TMS = ["TM1","TM2","TM3","TM4","TM5","TM6","TM7"];

// Vivid receptor palette — max contrast for poster
const REC_COLORS = [
  "#FF0040","#FF7700","#FFD700","#00C800","#00AAFF",
  "#CC00FF","#FF007F","#00E5CC","#FF4400","#4488FF",
  "#AADD00","#FF44BB","#00BBFF","#FF9900","#BB44FF",
  "#0033AA","#AA0022","#22AA55","#DD8800","#6600CC",
  "#00CC99","#CC3300","#3355FF","#996600","#009999",
  "#CC0066","#666600"
];
const receptors = [...new Set(raw.map(d=>d.receptor))].sort();
const recColor = {};
receptors.forEach((r,i) => recColor[r] = REC_COLORS[i % REC_COLORS.length]);

const N_SUBS = SCHEMA.flatMap(s=>s.subs).length;
const grid = document.getElementById("grid");
grid.style.gridTemplateColumns = `72px repeat(${N_SUBS}, 1fr)`;
grid.style.gridTemplateRows = `auto auto repeat(${TMS.length}, minmax(96px, auto))`;

// Spacer
const spacer = document.createElement("div");
spacer.className = "h-spacer";
spacer.style.gridColumn = "1"; spacer.style.gridRow = "1 / 3";
spacer.innerHTML = `<span>TM<br>Region</span>`;
grid.appendChild(spacer);

// Parent + sub headers
let colIdx = 2;
SCHEMA.forEach(({ parent, color, bgColor, subs }) => {
  const ph = document.createElement("div");
  ph.className = "h-parent";
  ph.style.gridColumn = `${colIdx} / ${colIdx + subs.length}`;
  ph.style.gridRow = "1";
  ph.style.color = color;
  ph.style.background = bgColor;
  ph.style.borderBottom = `3px solid ${color}`;
  ph.style.borderRight = `2px solid #b0bae8`;
  ph.textContent = parent;
  grid.appendChild(ph);

  subs.forEach((sub, si) => {
    const sh = document.createElement("div");
    sh.className = "h-sub";
    sh.style.gridColumn = `${colIdx + si}`;
    sh.style.gridRow = "2";
    sh.style.color = color;
    sh.style.background = bgColor;
    sh.style.opacity = "0.85";
    if (si === subs.length - 1) sh.style.borderRight = "2px solid #b0bae8";
    sh.textContent = sub;
    grid.appendChild(sh);
  });
  colIdx += subs.length;
});

// TM rows
TMS.forEach((tm, tmIdx) => {
  const row = tmIdx + 3;

  const lbl = document.createElement("div");
  lbl.className = "tm-label";
  lbl.style.gridColumn = "1"; lbl.style.gridRow = `${row}`;
  // Alternate TM label backgrounds
  lbl.style.background = tmIdx % 2 === 0 ? "#eaedff" : "#f4f6ff";
  lbl.textContent = tm;
  grid.appendChild(lbl);

  let ci = 2;
  SCHEMA.forEach(({ parent, color, bgColor, subs }) => {
    subs.forEach((sub, si) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.gridColumn = `${ci + si}`; cell.style.gridRow = `${row}`;
      if (si === 0) cell.style.borderLeft = "2px solid #b0bae8";
      if (si === subs.length - 1) cell.style.borderRight = "2px solid #b0bae8";
      // very subtle bg tint per class column
      cell.style.background = tmIdx % 2 === 0 ? "#ffffff" : "#fafbff";

      const variants = raw.filter(d => d.tm === tm && d.sub === sub);
      if (variants.length > 0) {
        const byRec = {};
        variants.forEach(v => { if (!byRec[v.receptor]) byRec[v.receptor]=[]; byRec[v.receptor].push(v); });

        Object.entries(byRec).forEach(([rec, vs]) => {
          const count = vs.length;
          const size = 16 + count * 10;
          const fontSize = Math.max(9, Math.min(14, size * 0.32));
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.style.width = size + "px";
          bubble.style.height = size + "px";
          bubble.style.background = recColor[rec];
          bubble.style.boxShadow = `0 2px 10px ${recColor[rec]}66`;
          bubble.style.fontSize = fontSize + "px";
          bubble.textContent = count > 1 ? count : "";

          const bwList = vs.map(v=>v.bw).join(", ");
          const noteList = [...new Set(vs.map(v=>v.note))].join("<br>");
          bubble.addEventListener("mousemove", e => {
            const t = document.getElementById("tt");
            t.innerHTML = `
              <span class="tt-receptor" style="color:${recColor[rec]}">${rec}</span>
              &nbsp;<span class="tt-bw">BW ${bwList}</span><br>
              <span style="color:${color};font-size:0.7rem;font-weight:700">${parent} → ${sub}</span> · ${tm}<br>
              <span class="tt-note">${noteList}</span>
              <div class="tt-count">▲ ${count} mutation${count>1?'s':''} in this cell</div>`;
            t.style.opacity = "1";
            t.style.left = (e.clientX+14)+"px"; t.style.top = (e.clientY-10)+"px";
          });
          bubble.addEventListener("mouseleave", () => document.getElementById("tt").style.opacity="0");
          cell.appendChild(bubble);
        });
      }
      grid.appendChild(cell);
    });
    ci += subs.length;
  });
});

// Legend
const legEl = document.getElementById("rec-legend");
receptors.forEach(r => {
  const item = document.createElement("div");
  item.className = "l-item";
  item.innerHTML = `<div class="l-dot" style="background:${recColor[r]};box-shadow:0 1px 4px ${recColor[r]}88"></div>${r}`;
  legEl.appendChild(item);
});

document.addEventListener("mousemove", e => {
  const t = document.getElementById("tt");
  if (t.style.opacity === "1") { t.style.left=(e.clientX+14)+"px"; t.style.top=(e.clientY-10)+"px"; }
});
</script>
</body>
</html>
