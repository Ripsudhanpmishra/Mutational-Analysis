<div style="background: #f5f3ec; border-radius: 12px; padding: 20px;">
<h3 style="margin:0 0 4px 0;font-size:18px;font-weight:600;color:#2c2b28;font-family:sans-serif">Receptor–G Protein Coupling Network</h3>
<p style="margin:0 0 14px 0;font-size:13px;color:#6b6a64;font-family:sans-serif">All 27 GPCRs (left) linked to every G-protein type they couple to (right). Hover a receptor, a G-protein, or a connector for details.</p>

<div id="legend" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;font-family:sans-serif">
</div>

<svg width="100%" viewBox="0 0 680 970" role="img">
<title>Full receptor to G-protein coupling network</title>
<desc>Bipartite diagram connecting all 27 GPCR receptors on the left to all G-protein types each one couples to on the right, including receptors that couple to more than one G-protein</desc>
<g id="links"></g>
<g id="leftnodes"></g>
<g id="rightnodes"></g>
</svg>

<div id="detail" style="margin-top:14px;padding:12px 16px;background:#ffffff;border:1px solid #dcdacd;border-radius:8px;font-size:13.5px;color:#3a3934;font-family:sans-serif;min-height:20px;">Hover a receptor, a G-protein, or a connector to see the full coupling detail.</div>
</div>
<script>
const colors = {"*Gq":"#2a78d6","*Gq/11":"#eb6834","G12/13":"#008300","Gi":"#e34948","Gq":"#4a3aa7","Gq/11":"#eda100","Gs":"#e87ba4"};
const gorder = ["*Gq","*Gq/11","G12/13","Gi","Gq","Gq/11","Gs"];
const receptors = [
  {r:"ADRA1A", g:["Gq/11"], pos:"6.48, 7.5, 7.53"},
  {r:"ADRB2", g:["Gs"], pos:"2.5, 3.5, 6.47"},
  {r:"ADRB3", g:["Gs"], pos:"4.5, 5.41, 6.48, 7.5"},
  {r:"AGTR1", g:["G12/13", "Gq/11"], pos:"2.5"},
  {r:"CASR", g:["Gi", "Gq/11"], pos:"3.5, 5.5, 7.53"},
  {r:"CNR1", g:["Gi"], pos:"5.5"},
  {r:"FFAR1", g:["Gi", "Gq/11"], pos:"3.44, 7.49, 7.53"},
  {r:"FFAR2", g:["Gi", "Gq"], pos:"2.5, 5.5, 6.33, 6.47"},
  {r:"GHSR", g:["Gq/11"], pos:"6.48"},
  {r:"GLP2R", g:["Gs"], pos:"2.46"},
  {r:"GPBAR", g:["Gs"], pos:"4.5, 6.48, 7.49"},
  {r:"GPR142", g:["*Gq/11"], pos:"6.48, 6.5"},
  {r:"GPR75", g:["Gq/11"], pos:"1.5, 2.5, 7.53"},
  {r:"LPAR1", g:["G12/13", "Gi", "Gq"], pos:"3.44, 3.49, 3.51, 7.49, 7.5"},
  {r:"LPAR3", g:["Gi", "Gq"], pos:"3.5, 6.33, 7.49"},
  {r:"LPAR5", g:["G12/13", "Gq"], pos:"3.44, 3.51, 6.33, 6.48, 6.5"},
  {r:"LPAR6", g:["Gi", "Gs"], pos:"1.5, 3.44, 4.5, 6.33"},
  {r:"MC4R", g:["*Gq", "Gs"], pos:"7.53"},
  {r:"MTNR1B", g:["Gi"], pos:"4.5, 5.46, 5.5"},
  {r:"NPY1R", g:["Gi"], pos:"1.5, 3.44, 3.49, 5.46, 7.5"},
  {r:"PTGER3", g:["Gi"], pos:"6.33, 6.47"},
  {r:"S1PR1", g:["Gi"], pos:"6.47"},
  {r:"S1PR2", g:["G12/13", "Gi", "Gq"], pos:"3.5, 6.47, 6.48"},
  {r:"SCTR", g:["Gs"], pos:"3.5"},
  {r:"SSTR2", g:["Gi"], pos:"1.5, 3.51, 7.49"},
  {r:"SUCNR1", g:["Gi", "Gq/11"], pos:"3.51, 4.5"},
  {r:"VIPR1", g:["Gs"], pos:"3.5, 3.54"}
];
const rowH = 34, boxH = 27, startY = 30, leftX = 40, leftW = 130, rightX = 480, rightW = 160;
const rightSpan = (receptors.length - 1) * rowH;
const rightStep = rightSpan / (gorder.length - 1);
const rightCY = {};
gorder.forEach((g, k) => { rightCY[g] = startY + boxH / 2 + k * rightStep; });

let leftHtml = "", rightHtml = "", linkHtml = "";
receptors.forEach((rec, i) => {
  const y = startY + i * rowH;
  const cy = y + boxH / 2;
  leftHtml += '<g class="node" data-r="' + rec.r + '">' +
    '<rect x="' + leftX + '" y="' + y + '" width="' + leftW + '" height="' + boxH + '" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="0.75"/>' +
    '<text x="' + (leftX + 12) + '" y="' + cy + '" dominant-baseline="central" font-size="15" fill="#0b0b0b" font-family="sans-serif">' + rec.r + '</text>' +
    '</g>';
  rec.g.forEach(g => {
    linkHtml += '<path class="link" data-r="' + rec.r + '" data-g="' + g + '" fill="none" stroke="' + colors[g] + '" stroke-width="2.4" opacity="0.55" d="M' + (leftX + leftW) + ',' + cy + ' C' + ((leftX + leftW + rightX) / 2) + ',' + cy + ' ' + ((leftX + leftW + rightX) / 2) + ',' + rightCY[g] + ' ' + rightX + ',' + rightCY[g] + '"/>';
  });
});
gorder.forEach(g => {
  const cy = rightCY[g];
  rightHtml += '<g class="node" data-g="' + g + '">' +
    '<rect x="' + rightX + '" y="' + (cy - 14) + '" width="' + rightW + '" height="28" rx="6" fill="#ffffff" stroke="' + colors[g] + '" stroke-width="2"/>' +
    '<text x="' + (rightX + rightW / 2) + '" y="' + cy + '" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0b0b0b" font-family="sans-serif">' + g + '</text>' +
    '</g>';
});
document.getElementById('links').innerHTML = linkHtml;
document.getElementById('leftnodes').innerHTML = leftHtml;
document.getElementById('rightnodes').innerHTML = rightHtml;

let legendHtml = "";
gorder.forEach(g => {
  legendHtml += '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#3a3934;">' +
    '<span style="width:12px;height:12px;border-radius:3px;background:' + colors[g] + ';display:inline-block;"></span>' + g + '</div>';
});
document.getElementById('legend').innerHTML = legendHtml;

const detail = document.getElementById('detail');
const recMap = {};
receptors.forEach(r => recMap[r.r] = r);

function dim() {
  document.querySelectorAll('.link').forEach(p => { p.setAttribute('opacity', '0.08'); p.setAttribute('stroke-width', '2.4'); });
}
function reset() {
  document.querySelectorAll('.link').forEach(p => { p.setAttribute('opacity', '0.55'); p.setAttribute('stroke-width', '2.4'); });
  detail.textContent = 'Hover a receptor, a G-protein, or a connector to see the full coupling detail.';
}
document.querySelectorAll('#leftnodes .node').forEach(n => {
  n.addEventListener('mouseenter', () => {
    dim();
    document.querySelectorAll('.link[data-r="' + n.dataset.r + '"]').forEach(p => { p.setAttribute('opacity', '1'); p.setAttribute('stroke-width', '3.5'); });
    const rec = recMap[n.dataset.r];
    detail.textContent = rec.r + ' couples to ' + rec.g.join(', ') + ' — observed at BW positions: ' + rec.pos;
  });
  n.addEventListener('mouseleave', reset);
});
document.querySelectorAll('#rightnodes .node').forEach(n => {
  n.addEventListener('mouseenter', () => {
    dim();
    const links = document.querySelectorAll('.link[data-g="' + n.dataset.g + '"]');
    links.forEach(p => { p.setAttribute('opacity', '1'); p.setAttribute('stroke-width', '3.5'); });
    const names = Array.from(links).map(p => p.dataset.r).join(', ');
    detail.textContent = n.dataset.g + ' couples to: ' + names;
  });
  n.addEventListener('mouseleave', reset);
});
document.querySelectorAll('.link').forEach(p => {
  p.style.cursor = 'pointer';
  p.style.pointerEvents = 'stroke';
  p.addEventListener('mouseenter', () => {
    dim();
    p.setAttribute('opacity', '1');
    p.setAttribute('stroke-width', '3.5');
    const rec = recMap[p.dataset.r];
    detail.textContent = rec.r + ' — ' + p.dataset.g + ' — BW positions: ' + rec.pos;
  });
  p.addEventListener('mouseleave', reset);
});
</script>
