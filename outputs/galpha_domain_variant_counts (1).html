<style>
.pill{border:1.5px solid;border-radius:14px;background:transparent;font-size:12px;padding:4px 10px;cursor:pointer;opacity:1}
.pill.inactive{opacity:0.3}
.dot{transition:opacity 0.15s}
</style>
<script>
(function(){
  var genes = ["Gi_Protein", "Go_Protein", "Gq_Protein", "G11_Protein", "G13_Protein", "G12_Protein", "Gs_Protein"];
  var active = new Set(genes);
  function render(){
    genes.forEach(function(g){
      var show = active.has(g);
      document.querySelectorAll(".gene-"+g).forEach(function(el){ el.style.opacity = show ? "1" : "0"; el.style.pointerEvents = show ? "auto" : "none"; });
      var pill = document.querySelector('.pill[data-gene="'+g+'"]');
      if(pill) pill.classList.toggle("inactive", !show);
    });
    var n = active.size;
    document.getElementById("statusline").textContent = n === genes.length ? "All 7 G-Proteins Shown" : (n === 0 ? "No G-Protein Selected" : n + " G-Protein" + (n>1?"s":"") + " Shown");
  }
  document.querySelectorAll(".pill").forEach(function(pill){
    pill.addEventListener("click", function(){
      var g = pill.getAttribute("data-gene");
      if(active.has(g)) active.delete(g); else active.add(g);
      render();
    });
  });
  document.getElementById("selall").addEventListener("click", function(){ active = new Set(genes); render(); });
  document.getElementById("clrall").addEventListener("click", function(){ active = new Set(); render(); });
  render();
})();
</script>
