<!DOCTYPE html>

<title>GPCR Variant Circular Bar Plot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
  :root{
    --bg:#ffffff;--surface:#f5f6fb;--border:#dde0f0;
    --text:#0d1240;--muted:#7078a8;
    --sans:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:var(--sans);color:var(--text);padding:1.5rem 2rem 2rem}

  .page-header{margin-bottom:1.2rem;text-align:center}
  .page-header h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;color:#0d1240}
  .page-header p{font-size:.78rem;color:var(--muted);margin-top:.3rem;font-weight:500;line-height:1.6}



  #svg-wrap{display:flex;justify-content:center}
  #svg-wrap svg{display:block;width:100%;height:auto;max-width:940px}

  /* receptor legend strip */
  .rec-legend-strip{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:.4rem 1.1rem;
    margin-top:1.2rem;
    padding:.7rem 1.2rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
  }
  .rec-item{display:flex;align-items:center;gap:6px;font-size:.72rem;font-family:var(--mono);font-weight:600;color:#0d1240;white-space:nowrap}
  .rec-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,.12)}

  /* tooltip */
  .tt{position:fixed;background:#0d1240;border:1.5px solid #3a4aaa;border-radius:10px;
    padding:.6rem .85rem;font-size:.72rem;color:#fff;pointer-events:none;opacity:0;
    transition:opacity .1s;z-index:999;max-width:260px;line-height:1.8;
    box-shadow:0 8px 36px rgba(0,0,0,.3)}
  .tt-rec{font-weight:700;font-size:.84rem}
  .tt-bw{font-family:var(--mono);color:#7eb8ff;font-size:.75rem}
  .tt-cat{font-size:.67rem;font-weight:600}
  .tt-note{color:#b0c0e8;font-size:.68rem}
  .tt-n{color:#ffe066;font-size:.68rem;margin-top:2px;font-weight:700}
</style>
</head>

  "Motif":            {fill:"#7B2FBE",light:"#F3EAFF"},
  "Structural Pivot": {fill:"#1B8C5E",light:"#E6F7F2"},

  "TM1":"#C5CAE9","TM2":"#B3E5FC","TM3":"#C8E6C9",
  "TM4":"#FFF9C4","TM5":"#FFCCBC","TM6":"#F8BBD0","TM7":"#D7CCC8",
};
const TM_STROKE = {
  "TM1":"#7986CB","TM2":"#29B6F6","TM3":"#66BB6A",
  "TM4":"#FDD835","TM5":"#FF7043","TM6":"#EC407A","TM7":"#A1887F",
};

const receptors = Object.keys(REC_PAL);
const parents   = Object.keys(PARENT_PAL);
const TMS       = ["TM1","TM2","TM3","TM4","TM5","TM6","TM7"];

/* ── side panel legends ───────────────────────────── */

receptors.forEach(r => {

/* ── geometry ─────────────────────────────────────── */
const W=940, H=940, CX=W/2, CY=H/2;
const R_HOLE  = 108;   // white centre
const R_TM_IN = 110;   // TM ring inner
const R_TM_OUT= 144;   // TM ring outer
const R_FUNC  = 156;   // functional class band outer
const R_BASE  = 168;   // bars start here
const R_MAX   = 360;   // bars reach here at the data's actual max stack count
const BAR_GAP = 0.9;   // degrees gap between bars
const GRP_GAP = 6.5;   // degrees gap between groups

const tt = document.getElementById("tt");

function toXY(deg, r){
  const a=(deg-90)*Math.PI/180;
  return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
}

function arcD(r,s,e,cw=1){
  const [x1,y1]=toXY(s,r),[x2,y2]=toXY(e,r);
  const lg=Math.abs(e-s)>180?1:0;
  return `M${x1},${y1} A${r},${r},0,${lg},${cw},${x2},${y2}`;
}

function sliceD(r1,r2,s,e){
  const[ax,ay]=toXY(s,r1),[bx,by]=toXY(e,r1);
  const[cx,cy]=toXY(e,r2),[dx,dy]=toXY(s,r2);
  const lg=Math.abs(e-s)>180?1:0;
  return `M${ax},${ay} A${r1},${r1},0,${lg},1,${bx},${by} L${cx},${cy} A${r2},${r2},0,${lg},0,${dx},${dy} Z`;
}

function svgEl(tag,attrs={}){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}

function svgText(text,x,y,attrs={}){
  const el=svgEl("text",{x,y,...attrs});
  el.textContent=text; return el;
}

/* ── build bar groups ─────────────────────────────── */
function buildGroups(mode){
  let keys;
  if(mode==="tm")     keys=TMS;
  else if(mode==="parent") keys=parents;
  else keys=[...new Set(raw.map(d=>d.bw))].sort((a,b)=>parseFloat(a)-parseFloat(b));

  return keys.map(key=>{
    const subset = mode==="tm"     ? raw.filter(d=>d.tm===key)
                 : mode==="parent" ? raw.filter(d=>d.parent===key)
                 :                   raw.filter(d=>d.bw===key);
    if(!subset.length) return null;
    /* collapse to unique BW bars within each group */
    const bwMap={};
    subset.forEach(d=>{
      const k=d.bw;
      if(!bwMap[k]) bwMap[k]={bw:k,tm:d.tm,parent:d.parent,sub:d.sub,note:d.note,items:[]};
      bwMap[k].items.push(d);
    });
    const bars=Object.values(bwMap).sort((a,b)=>parseFloat(a.bw)-parseFloat(b.bw));
    return {key, bars};
  }).filter(Boolean);
}

/* ── main draw ────────────────────────────────────── */
function draw(mode){
  const groups=buildGroups(mode);
  const totalBars=groups.reduce((s,g)=>s+g.bars.length,0);
  const totalGapDeg=groups.length*GRP_GAP;
  const availDeg=360-totalGapDeg;
  const barDeg=(availDeg/totalBars)-BAR_GAP;

  /* scale is driven by whatever the data's tallest stacked bar actually is,
     never a hardcoded assumption — this is what previously let bars overshoot R_MAX */
  const MAX_STACK = Math.max(1, ...groups.flatMap(g=>g.bars.map(b=>b.items.length)));
  const RING_TICKS = Math.min(MAX_STACK, 5);

  const svg=svgEl("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,style:"width:100%;height:auto;max-width:940px"});

  /* background */
  svg.appendChild(svgEl("circle",{cx:CX,cy:CY,r:W/2-4,fill:"#f8f9fd"}));
  svg.appendChild(svgEl("circle",{cx:CX,cy:CY,r:R_MAX+32,fill:"#ffffff"}));

  /* subtle reference rings, spaced evenly up to the real max stack count */
  for(let i=1;i<=RING_TICKS;i++){
    const value = Math.round(MAX_STACK*i/RING_TICKS);
    const r=R_BASE+(R_MAX-R_BASE)*value/MAX_STACK;
    svg.appendChild(svgEl("circle",{cx:CX,cy:CY,r,fill:"none",
      stroke:"#e0e4f4","stroke-width":"0.75","stroke-dasharray":"2 5"}));
    /* ring count label at top */
    if(i<RING_TICKS){
      const lt=svgText(value, CX, CY-r-3, {
        "text-anchor":"middle","font-size":"7.5",fill:"#bbbdd0",
        "font-family":"JetBrains Mono, monospace","font-weight":"600","pointer-events":"none"});
      svg.appendChild(lt);
    }
  }

  /* ── draw bars ── */
  let angle=0;
  groups.forEach(group=>{
    const groupStart=angle;

    group.bars.forEach((bar,bi)=>{
      const s=angle, e=s+barDeg, mid=(s+e)/2;
      const count=bar.items.length;
      const rTop=R_BASE+(R_MAX-R_BASE)*count/MAX_STACK;

      /* TM ring slice */
      const tmFill=TM_PAL[bar.tm]||"#ddd";
      const tmStroke=TM_STROKE[bar.tm]||"#aaa";
      svg.appendChild(svgEl("path",{
        d:sliceD(R_TM_OUT,R_TM_IN,s-0.3,e+0.3),
        fill:tmFill,stroke:tmStroke,"stroke-width":"0.6","stroke-linejoin":"round"
      }));

      /* functional class band */
      const pFill=PARENT_PAL[bar.parent]?.fill||"#888";
      svg.appendChild(svgEl("path",{
        d:sliceD(R_FUNC,R_TM_OUT+0.5,s-0.2,e+0.2),
        fill:pFill,opacity:"0.18"
      }));
      svg.appendChild(svgEl("path",{
        d:arcD(R_FUNC,s-0.2,e+0.2),
        fill:"none",stroke:pFill,"stroke-width":"2","stroke-linecap":"round",opacity:"0.7"
      }));

      /* stacked receptor bars */
      const byRec={};
      bar.items.forEach(d=>{if(!byRec[d.receptor])byRec[d.receptor]=[];byRec[d.receptor].push(d);});
      let rCur=R_BASE;
      Object.entries(byRec).forEach(([rec,vs])=>{
        const n=vs.length;
        const segHeight=(R_MAX-R_BASE)*n/MAX_STACK;
        const rNext=rCur+segHeight;
        const bp=svgEl("path",{
          d:sliceD(rNext,rCur,s+0.4,e-0.4),
          fill:REC_PAL[rec]||"#999",
          stroke:"rgba(255,255,255,0.6)","stroke-width":"0.8"
        });
        bp.style.cursor="pointer";

        /* tooltip */
        const recSummary=Object.entries(byRec)
          .map(([r,a])=>`<span style="color:${REC_PAL[r]};font-weight:700">${r}</span> (${a.length})`)
          .join("  ");
        const notes=[...new Set(bar.items.map(v=>v.note))].join("<br>");
        bp.addEventListener("mousemove",ev=>{
          tt.innerHTML=`
            <div class="tt-rec">${recSummary}</div>
            <div class="tt-bw">BW ${bar.bw} &nbsp;·&nbsp; ${bar.tm}</div>
            <div class="tt-cat" style="color:${pFill}">${bar.parent} — ${bar.sub}</div>
            <div class="tt-note">${notes}</div>
            <div class="tt-n">▲ ${count} mutation${count>1?"s":""}</div>`;
          tt.style.opacity="1";
          tt.style.left=(ev.clientX+14)+"px";tt.style.top=(ev.clientY-10)+"px";
        });
        bp.addEventListener("mouseleave",()=>tt.style.opacity="0");
        svg.appendChild(bp);
        rCur=rNext;
      });

      /* top cap line */
      svg.appendChild(svgEl("path",{
        d:arcD(rTop,s+0.4,e-0.4),
        fill:"none",stroke:"rgba(255,255,255,0.9)","stroke-width":"1.2","pointer-events":"none"
      }));

      /* BW label — inside the ring at the bar base */
      const labelR = (R_TM_IN + R_TM_OUT) / 2;
      const [lx,ly] = toXY(mid, labelR);
      const rot = mid<=180 ? mid-90 : mid+90;
      const lbl = svgText(bar.bw, lx, ly, {
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        "font-size": barDeg > 6 ? "7" : barDeg > 4 ? "6" : "5.5",
        "font-family": "JetBrains Mono, monospace",
        "font-weight": "700",
        fill: "#0d1240",
        transform: `rotate(${rot},${lx},${ly})`,
        "pointer-events": "none"
      });
      svg.appendChild(lbl);

      /* count badges removed */

      angle=e+BAR_GAP;
    });

    /* group separator arc + label */
    const groupEnd=angle;
    const groupMid=(groupStart+groupEnd)/2;

    /* coloured arc outside bars */
    const arcColor = mode==="tm"     ? (TM_STROKE[group.key]||"#888")
                   : mode==="parent" ? (PARENT_PAL[group.key]?.fill||"#888")
                   : "#8892c0";
    svg.appendChild(svgEl("path",{
      d:arcD(R_MAX+22,groupStart+1,groupEnd-1),
      fill:"none",stroke:arcColor,"stroke-width":"3.5","stroke-linecap":"round"
    }));

    /* group label outside arc */
    const [gx,gy]=toXY(groupMid, R_MAX+42);
    const grot = groupMid<=180 ? groupMid-90 : groupMid+90;
    const shortKey = group.key.length>18 ? group.key.replace(" ","·") : group.key;
    const gl=svgText(shortKey,gx,gy,{
      "text-anchor":"middle","dominant-baseline":"middle",
      "font-size":"13","font-weight":"800",
      "font-family":"Inter, sans-serif",
      "letter-spacing":"-0.3",
      fill:arcColor,
      transform:`rotate(${grot},${gx},${gy})`,
      "pointer-events":"none"
    });
    svg.appendChild(gl);

    angle+=GRP_GAP;
  });

  /* white centre hole */
  svg.appendChild(svgEl("circle",{cx:CX,cy:CY,r:R_HOLE,fill:"#ffffff",
    stroke:"#e4e6f4","stroke-width":"1"}));

  /* centre labels */
  svg.appendChild(svgText("GPCR",CX,CY-12,{
    "text-anchor":"middle","font-size":"15","font-weight":"800",
    "font-family":"Inter, sans-serif",fill:"#0d1240"
  }));
  svg.appendChild(svgText("Variants",CX,CY+6,{
    "text-anchor":"middle","font-size":"10.5",
    "font-family":"Inter, sans-serif",fill:"#7078a8"
  }));
  svg.appendChild(svgText(`n = ${raw.length}`,CX,CY+22,{
    "text-anchor":"middle","font-size":"9.5",
    "font-family":"JetBrains Mono, monospace","font-weight":"600",fill:"#9098c0"
  }));

  document.getElementById("svg-wrap").innerHTML="";
  document.getElementById("svg-wrap").appendChild(svg);
}

draw("tm");



document.addEventListener("mousemove",ev=>{
  if(tt.style.opacity==="1"){tt.style.left=(ev.clientX+14)+"px";tt.style.top=(ev.clientY-10)+"px";}
});
</script>
</body>
